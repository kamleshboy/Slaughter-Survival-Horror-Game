<title>Slaughter</title>
<style>
:root{--bg:#000;--fg:#eee;--accent:#c33;--panel:#1b1b1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--fg:#eee;--panel:#1b1b1b}}
:root[data-theme="dark"]{--bg:#000;--fg:#eee;--panel:#1b1b1b}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:8px;left:12px;font-size:15px;text-shadow:0 0 4px #000;pointer-events:none;line-height:1.5}
#msg{position:absolute;bottom:18%;width:100%;text-align:center;font-size:18px;pointer-events:none;text-shadow:0 0 6px #000}
#bar{position:absolute;bottom:14px;left:12px;width:180px;height:12px;border:1px solid #888;background:#111;pointer-events:none}
#barf{display:block;height:100%;width:100%;background:#4c8}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.85);overflow:auto}
.box{background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:20px;max-width:460px;width:88%;text-align:center}
.box h1{color:var(--accent);margin:8px 0;letter-spacing:4px;font-size:40px}
.face{width:150px;height:200px;object-fit:cover;border-radius:50%;border:4px solid var(--accent);box-shadow:0 0 30px #c33}
button{display:block;width:100%;margin:8px 0;padding:10px;font-size:16px;border-radius:8px;border:1px solid #555;background:#2a2a2a;color:var(--fg);cursor:pointer}
button:hover{background:#3a3a3a}.play{background:var(--accent);font-size:22px;font-weight:bold}
#js{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#300;z-index:9}
#js img{height:100%;max-width:100%;object-fit:contain;animation:z .5s ease-out forwards,sh .08s infinite}
@keyframes z{from{transform:scale(.2)}to{transform:scale(1.5)}}
@keyframes sh{0%{margin:0}25%{margin:-14px 10px}50%{margin:12px -12px}75%{margin:-8px -10px}}
</style></head><body>
